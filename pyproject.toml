[project]
name = "exitcapsule"
version = "0.1.0"
description = "AI-powered dependency resilience engine: scan, baseline, plan (Gemma 4), migrate, compare and capsule."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "coverage>=7.16.2",
    "fastapi>=0.143.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "ollama>=0.6.3",
    "packaging>=26.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "rich>=15.0.0",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
exitcapsule = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures", "ui", "samples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network / real repos; skipped in CI"]
asyncio_mode = "auto"
addopts = "-ra"
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
