name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12 3.13
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy engine
      - run: uv run coverage run -m pytest -m "not slow"
        env:
          GEMMA_PROVIDER: fake
      - run: uv run coverage report
      - name: doctor (no Gemma key in CI)
        shell: bash
        run: |
          cp .env.example .env
          uv run exitcapsule doctor --no-gemma
